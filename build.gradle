plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
    id 'org.jetbrains.kotlin.jvm'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

kotlin {
    jvmToolchain(21)
}

repositories {
    maven {
        name = "BlameJared Maven"
        url = "https://maven.blamejared.com"
    }
    maven {
        name = "ParchmentMC Maven"
        url = "https://maven.parchmentmc.org"
    }
    // EMI
    maven { url = "https://maven.gnomecraft.net/releases" }
    maven { url = "https://maven.shedaniel.me/" }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Kotlin for Forge'
                url = 'https://thedarkcolour.github.io/KotlinForForge/'
            }
        }
        filter {
            includeGroup "thedarkcolour"
        }
    }
    exclusiveContent {
        forRepository {
            flatDir {
                dirs "libs"
            }
        }
        filter {
            includeGroup "libs"
        }
    }
    mavenCentral()
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Hexlink keeps its client-only sources in a separate source set (inherited from the
// Fabric split-environment layout). NeoForge has a single source set, so fold both
// src/client/kotlin and src/client/resources into main.
sourceSets.main.kotlin.srcDir('src/client/kotlin')
sourceSets.main.resources.srcDir('src/client/resources')

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Local dev builds (see libs/). HexCasting 0.12.0 is not published for 1.21.1 yet.
    implementation("libs:hexcasting-neoforge-$minecraft_version:$hexcasting_version")
    implementation("libs:paucal:$paucal_version+$minecraft_version-neoforge")
    implementation("libs:moreiotas-${moreiotas_version}-${minecraft_version}-devel-pre-${moreiotas_pre_num}")

    implementation("vazkii.patchouli:Patchouli:$minecraft_version-$patchouli_version-NEOFORGE")
    implementation("thedarkcolour:kotlinforforge-neoforge:$kff_version")
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"

    // EMI is optional: compile against the API, load the full jar only in dev runs.
    compileOnly("dev.emi:emi-neoforge:$emi_version:api")
    localRuntime("dev.emi:emi-neoforge:$emi_version")
}

// Expand ${...} placeholders in the mod metadata template.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        freeCompilerArgs.add('-Xjvm-default=all')
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
